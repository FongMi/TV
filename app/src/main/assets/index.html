<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <title data-i18n="title">影視</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/ui.css">
    <script src="js/jquery.min.js" defer></script>
    <script src="js/i18n.js" defer></script>
    <script src="js/choices.js" defer></script>
    <script src="js/navigation.js" defer></script>
    <script src="js/script.js" defer blocking="render"></script>
    <script src="js/input.js" defer></script>
    <script src="js/sha256.min.js" defer></script>
    <script src="js/upload.js" defer></script>
    <script src="js/download.js" defer></script>
    <script src="js/device.js" defer></script>
    <script src="js/remote.js" defer></script>
</head>

<body>
    <!-- Playback icons from AndroidX Media3 (Apache-2.0). -->
    <svg class="remote-icons" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
            <path id="remote-icon-repeat_off" d="M280,880L120,720L280,560L336,618L274,680L680,680L680,520L760,520L760,760L274,760L336,822L280,880ZM200,440L200,200L686,200L624,138L680,80L840,240L680,400L624,342L686,280L280,280L280,440L200,440Z"/>
            <path id="remote-icon-repeat_one" d="M460,600L460,420L400,420L400,360L520,360L520,600L460,600ZM280,880L120,720L280,560L336,618L274,680L680,680L680,520L760,520L760,760L274,760L336,822L280,880ZM200,440L200,200L686,200L624,138L680,80L840,240L680,400L624,342L686,280L280,280L280,440L200,440Z"/>
            <path id="remote-icon-previous" d="M220,720L220,240L300,240L300,720L220,720ZM740,720L380,480L740,240L740,720Z"/>
            <path id="remote-icon-pause" d="M560,760L560,200L720,200L720,760L560,760ZM240,760L240,200L400,200L400,760L240,760Z"/>
            <path id="remote-icon-play" d="M320,760L320,200L760,480L320,760Z"/>
            <path id="remote-icon-next" d="M660,720L660,240L740,240L740,720L660,720ZM220,720L220,240L580,480L220,720Z"/>
            <path id="remote-icon-stop" d="M240,720L240,240L720,240L720,720L240,720Z"/>
            <path id="file-icon-actions" d="M298,698L242,642L363,520L80,520L80,440L363,440L242,318L298,262L516,480L298,698ZM520,680L520,600L880,600L880,680L520,680ZM520,360L520,280L880,280L880,360L520,360ZM640,520L640,440L880,440L880,520L640,520Z"/>
    </defs></svg>
    <div id="app">
        <header class="app-header">
            <span class="page-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18v12z"/></svg></span>
            <div class="app-title">
                <h1 data-i18n="title">影視</h1>
                <button class="md-btn device-info-button" type="button" onclick="openDialog('deviceInfoDialog')" aria-haspopup="dialog" aria-controls="deviceInfoDialog" aria-describedby="device_status" data-i18n-label="deviceInfo" aria-label="裝置資訊" title="裝置資訊"><span id="device_status" role="status" data-i18n="deviceConnecting">連線中</span></button>
            </div>
            <div class="app-header-actions">
                <button id="device_retry" class="md-btn md-btn-tonal md-icon-button" type="button" data-i18n-label="logRetry" aria-label="重新連線" title="重新連線" hidden><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#refresh"/></svg></button>
                <a id="remote_open" class="md-btn md-btn-tonal md-icon-button" href="remote.html" data-i18n-label="remoteKeys" aria-label="遙控器" title="遙控器"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#remote"/></svg></a>
            </div>
        </header>
        <!-- Content -->
        <main class="app-body">
            <div id="panel1" class="tab-panel input-panel active">
                <div id="input_tabs" class="md-tabs input-tabs" role="tablist" aria-labelledby="input_tab_search input_tab_push">
                    <button id="input_tab_search" class="md-btn" type="button" role="tab" aria-selected="true" aria-controls="input_search" onclick="showInput('search')" data-i18n="search">搜尋</button>
                    <button id="input_tab_push" class="md-btn" type="button" role="tab" aria-selected="false" aria-controls="input_push" tabindex="-1" onclick="showInput('push')" data-i18n="push">推送</button>
                </div>
                <div id="input_search" class="input-page" role="tabpanel" aria-labelledby="input_tab_search">
                    <div class="md-card panel-content">
                        <div class="panel-intro"><h2 data-i18n="search">搜尋</h2></div>
                        <div class="submit-row">
                            <div class="md-field">
                                <label for="keyword" data-i18n="keyword">關鍵字</label>
                                <input id="keyword" class="md-input" type="text" />
                            </div>
                            <button id="action_search" class="md-btn md-btn-filled panel-action" onclick="search()"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#search"/></svg><span data-i18n="search">搜尋</span></button>
                        </div>
                    </div>
                    <details class="md-card input-library">
                        <summary class="disclosure-heading"><span data-i18n="recentSearch">最近搜尋</span></summary>
                        <div class="library-sections"><div id="search_history"></div><p class="panel-hint history-hint" data-i18n="historyHint">紀錄保存在此瀏覽器。</p></div>
                    </details>
                </div>
                <div id="input_push" class="input-page" role="tabpanel" aria-labelledby="input_tab_push" hidden>
                    <div class="md-card panel-content">
                        <div class="panel-intro"><h2 data-i18n="push">推送</h2></div>
                        <div class="submit-row">
                            <div class="md-field">
                                <label for="push_url" data-i18n="playbackUrl">播放網址</label>
                                <input id="push_url" class="md-input" type="text" />
                            </div>
                            <button id="action_push" class="md-btn md-btn-filled panel-action" onclick="push()"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#send"/></svg><span data-i18n="push">推送</span></button>
                        </div>
                    </div>
                    <details id="input_library" class="md-card input-library">
                        <summary class="disclosure-heading"><span data-i18n="recentPush">最近推送</span></summary>
                        <div class="library-sections"><div id="push_history"></div><p class="panel-hint history-hint" data-i18n="historyHint">紀錄保存在此瀏覽器。</p></div>
                    </details>
                </div>
            </div>
            <div id="panel2" class="tab-panel">
                <section id="remote_card" class="md-card remote-card" data-layout="loading" data-artwork="loading" aria-busy="true" aria-labelledby="remote_title">
                    <div class="remote-overview">
                        <div class="remote-media">
                            <div id="remote_artwork_frame" class="remote-artwork">
                                <img id="remote_artwork" alt="" referrerpolicy="no-referrer" hidden />
                                <svg aria-hidden="true" viewBox="0 0 960 960"><use href="#remote-icon-play"/></svg>
                            </div>
                            <div class="remote-heading"><div class="remote-title"><h2 id="remote_title" data-i18n="remoteTitle">播放</h2><p id="remote_subtitle_text" class="remote-subtitle" hidden></p></div><span id="remote_state" role="status" aria-live="polite" data-i18n="remoteConnecting">連線中…</span></div>
                        </div>
                        <div class="remote-progress-slot">
                            <div id="remote_progress" class="remote-progress" hidden>
                                <span id="remote_elapsed">0:00</span>
                                <div class="remote-slider">
                                    <input id="remote_bar" type="range" min="0" max="1" step="1" value="0" aria-label="播放進度" disabled />
                                    <div id="remote_track" class="remote-track" aria-hidden="true"><div class="remote-wave"></div></div>
                                </div>
                                <span id="remote_duration">0:00</span>
                            </div>
                        </div>
                    </div>
                    <div class="remote-actions-slot">
                        <div id="remote_actions" class="remote-actions" hidden>
                            <button id="remote_repeat" class="md-btn remote-icon-button" type="button" aria-label="循環播放" title="循環播放" aria-pressed="false" disabled><svg aria-hidden="true" viewBox="0 0 960 960"><use href="#remote-icon-repeat_off"/></svg></button>
                            <button id="remote_prev" class="md-btn remote-icon-button" type="button" aria-label="上集" title="上集" disabled><svg aria-hidden="true" viewBox="0 0 960 960"><use href="#remote-icon-previous"/></svg></button>
                            <button id="remote_toggle" class="md-btn md-btn-filled" type="button" aria-label="暫停" title="暫停" disabled><svg aria-hidden="true" viewBox="0 0 960 960"><use href="#remote-icon-pause"/></svg></button>
                            <button id="remote_next" class="md-btn remote-icon-button" type="button" aria-label="下集" title="下集" disabled><svg aria-hidden="true" viewBox="0 0 960 960"><use href="#remote-icon-next"/></svg></button>
                            <button id="remote_stop" class="md-btn remote-icon-button" type="button" aria-label="停止" title="停止" disabled><svg aria-hidden="true" viewBox="0 0 960 960"><use href="#remote-icon-stop"/></svg></button>
                        </div>
                    </div>
                    <button id="remote_retry" class="md-btn md-btn-tonal md-icon-button" type="button" hidden data-i18n-label="logRetry" aria-label="重新連線" title="重新連線"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#refresh"/></svg></button>
                </section>
                <div class="remote-tools">
                    <details id="remote_extra" class="md-card input-library remote-extra" hidden>
                        <summary class="disclosure-heading"><span data-i18n="morePlayback">更多播放操作</span></summary>
                        <div class="library-sections remote-extra-content">
                            <div class="remote-seek-actions">
                                <button id="remote_back30" class="md-btn md-btn-tonal md-icon-button" type="button" disabled data-i18n-label="back30" aria-label="快退 30 秒" title="快退 30 秒"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#back30"/></svg></button>
                                <button id="remote_back10" class="md-btn md-btn-tonal md-icon-button" type="button" disabled data-i18n-label="back10" aria-label="快退 10 秒" title="快退 10 秒"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#back10"/></svg></button>
                                <button id="remote_forward10" class="md-btn md-btn-tonal md-icon-button" type="button" disabled data-i18n-label="forward10" aria-label="快進 10 秒" title="快進 10 秒"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#forward10"/></svg></button>
                                <button id="remote_forward30" class="md-btn md-btn-tonal md-icon-button" type="button" disabled data-i18n-label="forward30" aria-label="快進 30 秒" title="快進 30 秒"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#forward30"/></svg></button>
                            </div>
                            <fieldset id="remote_speed" class="remote-speed-field">
                                <legend data-i18n="playbackSpeed">播放速度</legend>
                                <div class="remote-speed-options">
                                    <button class="md-btn md-btn-outlined" type="button" value="0.5" aria-pressed="false" disabled>0.5×</button>
                                    <button class="md-btn md-btn-outlined" type="button" value="1" aria-pressed="false" disabled>1.0×</button>
                                    <button class="md-btn md-btn-outlined" type="button" value="2" aria-pressed="false" disabled>2.0×</button>
                                    <button class="md-btn md-btn-outlined" type="button" value="3" aria-pressed="false" disabled>3.0×</button>
                                </div>
                            </fieldset>
                        </div>
                    </details>
                </div>
            </div>
            <div id="panel3" class="tab-panel">
                <div class="md-tabs input-tabs" role="tablist" aria-labelledby="media_tab_subtitles media_tab_danmaku">
                    <button id="media_tab_subtitles" class="md-btn" type="button" role="tab" aria-selected="true" aria-controls="media_subtitles" onclick="showMedia('subtitles')" data-i18n="subtitles">字幕</button>
                    <button id="media_tab_danmaku" class="md-btn" type="button" role="tab" aria-selected="false" aria-controls="media_danmaku" tabindex="-1" onclick="showMedia('danmaku')" data-i18n="danmaku">彈幕</button>
                </div>
                <p id="media_status" class="panel-hint" role="status" aria-live="polite" data-i18n="mediaPlaybackRequired">請先播放影片。</p>
                <section id="media_subtitles" class="md-card panel-content" role="tabpanel" aria-labelledby="media_tab_subtitles">
                    <div class="panel-intro"><h2 data-i18n="subtitles">字幕</h2></div>
                    <input id="subtitle_uploader" type="file" accept=".srt,.ssa,.ass" hidden />
                    <button id="remote_subtitle" class="md-btn md-btn-outlined" type="button" disabled><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#upload"/></svg><span data-i18n="localFile">本機檔案</span></button>
                </section>
                <div id="media_danmaku" class="input-page" role="tabpanel" aria-labelledby="media_tab_danmaku" hidden>
                    <section class="md-card panel-content">
                        <div class="panel-intro"><h2 data-i18n="danmaku">彈幕</h2></div>
                        <div class="md-field">
                            <label for="danmaku_url" data-i18n="danmakuUrl">彈幕網址</label>
                            <input id="danmaku_url" class="md-input" type="url" inputmode="url" />
                        </div>
                        <div class="media-actions">
                            <button id="danmaku_upload" class="md-btn md-btn-outlined" type="button" disabled><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#upload"/></svg><span data-i18n="localFile">本機檔案</span></button>
                            <button id="danmaku_apply" class="md-btn md-btn-filled" type="button" disabled><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#send"/></svg><span data-i18n="applyMedia">套用</span></button>
                        </div>
                        <input id="danmaku_uploader" type="file" accept="text/*,.xml,.json" hidden />
                    </section>
                    <details class="md-card input-library">
                        <summary class="disclosure-heading"><span data-i18n="sendDanmaku">發送彈幕</span></summary>
                        <div class="library-sections media-compose">
                            <div class="field-row danmaku-options">
                                <div class="md-field">
                                    <label id="danmakuModeLabel" for="danmaku_mode" data-i18n="mode">模式</label>
                                    <button id="danmaku_mode" class="md-btn md-btn-tonal md-btn-full" aria-labelledby="danmakuModeLabel danmaku_mode_label" aria-haspopup="dialog" aria-controls="danmakuModeDialog" onclick="showDanmakuModeDialog()">
                                        <span id="danmaku_mode_label" data-i18n="scroll">滾動</span>
                                        <svg class="select-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="icons.svg#chevron"/></svg>
                                    </button>
                                </div>
                                <div class="md-field">
                                    <label id="danmakuSizeLabel" for="danmaku_size" data-i18n="size">大小</label>
                                    <button id="danmaku_size" class="md-btn md-btn-tonal md-btn-full" aria-labelledby="danmakuSizeLabel danmaku_size_label" aria-haspopup="dialog" aria-controls="danmakuSizeDialog" onclick="showDanmakuSizeDialog()">
                                        <span id="danmaku_size_label" data-i18n="default">預設</span>
                                        <svg class="select-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="icons.svg#chevron"/></svg>
                                    </button>
                                </div>
                            </div>
                            <div class="md-field">
                                <label for="danmaku_text" data-i18n="danmakuText">彈幕內容</label>
                                <input id="danmaku_text" class="md-input" type="text" />
                            </div>
                            <button id="action_danmaku" class="md-btn md-btn-filled panel-action" onclick="sendDanmaku()"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#send"/></svg><span data-i18n="send">發送</span></button>
                        </div>
                    </details>
                </div>
            </div>
            <!-- 設定 -->
            <div id="panel4" class="tab-panel">
                <div class="md-card panel-content">
                    <div class="panel-intro"><h2 data-i18n="settings">設定</h2><p data-i18n="settingHint">傳送至裝置目前的輸入視窗。</p></div>
                    <div class="setting-fields">
                        <div class="md-field">
                            <label for="setting_name" data-i18n="name">名稱</label>
                            <input id="setting_name" class="md-input" type="text" />
                        </div>
                        <div class="md-field">
                            <label for="setting_text" data-i18n="config">配置</label>
                            <input id="setting_text" class="md-input" type="text" />
                        </div>
                    </div>
                    <button id="action_setting" onclick="setting()" class="md-btn md-btn-filled panel-action"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#send"/></svg><span data-i18n="send">發送</span></button>
                </div>
                <div class="md-card panel-content">
                    <a class="panel-link" href="logs.html">
                        <span class="panel-link-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 3h16v18H4V3zm2 2v14h12V5H6zm2 3h8v2H8V8zm0 4h8v2H8v-2zm0 4h5v2H8v-2z"/></svg></span>
                        <span class="panel-link-text"><span data-i18n="logTitle">應用日誌</span></span>
                        <svg class="select-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="icons.svg#chevron"/></svg>
                    </a>
                    <a class="panel-link" href="spider.html">
                        <span class="panel-link-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m8 5-7 7 7 7 1.4-1.4L3.8 12l5.6-5.6L8 5zm8 0-1.4 1.4 5.6 5.6-5.6 5.6L16 19l7-7-7-7zM14 3l-4 18h2l4-18h-2z"/></svg></span>
                        <span class="panel-link-text"><span data-i18n="spiderTitle">爬蟲測試</span></span>
                        <svg class="select-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="icons.svg#chevron"/></svg>
                    </a>
                </div>
            </div>
            <!-- 本地 -->
            <div id="panel5" class="tab-panel">
                <div class="md-card panel-content files-panel">
                    <div class="files-header">
                        <div class="files-title">
                            <div class="panel-intro"><h2 data-i18n="local">本地</h2></div>
                            <span id="file_selection_count" class="panel-hint" role="status" hidden></span>
                            <button id="file_select" class="md-btn md-btn-tonal md-icon-button" type="button" onclick="setFileSelection(true)" disabled data-i18n-label="select" aria-label="選取" title="選取"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#select"/></svg></button>
                            <button id="file_selection_cancel" class="md-btn md-btn-tonal md-icon-button" type="button" onclick="setFileSelection(false)" data-i18n-label="cancel" aria-label="取消" title="取消" hidden><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#close"/></svg></button>
                        </div>
                        <input type="file" id="file_uploader" onchange="onFileSelected()" multiple />
                        <div id="file_upload_actions" class="file-toolbar">
                            <button class="md-btn md-btn-tonal" type="button" onclick="openDialog('downloadDialog')" data-i18n-label="downloadFromUrl" aria-label="網址下載" title="網址下載"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#download"/></svg><span data-i18n="downloadStart">下載</span></button>
                            <button class="md-btn md-btn-tonal md-icon-button" onclick="uploadFile()" data-i18n-label="uploadFile" aria-label="上傳檔案" title="上傳檔案"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#upload"/></svg></button>
                            <button class="md-btn md-btn-tonal md-icon-button" onclick="showNewFolderDialog()" data-i18n-label="newFolder" aria-label="新增資料夾" title="新增資料夾"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#new-folder"/></svg></button>
                        </div>
                        <div id="file_selection" class="file-selection" hidden>
                            <div class="file-toolbar">
                                <button id="file_select_all" class="md-btn md-btn-tonal" type="button" onclick="selectAllFiles()" data-i18n="selectAll">全選</button>
                                <button id="file_move_selected" class="md-btn md-btn-tonal md-icon-button" type="button" onclick="showFileChangeDialog('move', Array.from(selectedFiles.values()))" disabled data-i18n-label="move" aria-label="搬移" title="搬移"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#move"/></svg></button>
                                <button id="file_delete_selected" class="md-btn md-btn-outlined md-icon-button" type="button" onclick="showBatchDelete()" disabled data-i18n-label="delete" aria-label="刪除" title="刪除"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#delete"/></svg></button>
                            </div>
                            <p id="file_batch_status" class="panel-hint" role="status" hidden></p>
                        </div>
                    </div>
                    <div class="file-browser">
                        <div class="file-location">
                            <nav id="file_breadcrumbs" class="file-breadcrumbs" aria-label="路徑"><button id="file_up" class="md-btn remote-icon-button file-parent" type="button" onclick="listFile(currentRoot.slice(0, currentRoot.lastIndexOf('/')), true)" aria-label="上層" title="上層" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.42-1.41L7.83 13H20v-2z"/></svg><span id="file_path" role="status"></span></button></nav>
                            <button id="file_refresh" class="md-btn remote-icon-button file-refresh" type="button" onclick="listFile(currentRoot)" aria-label="重新整理" title="重新整理"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M17.65,6.35C16.2,4.9 14.21,4 12,4c-4.42,0 -7.99,3.58 -7.99,8s3.57,8 7.99,8c3.73,0 6.84,-2.55 7.73,-6h-2.08c-0.82,2.33 -3.04,4 -5.65,4 -3.31,0 -6,-2.69 -6,-6s2.69,-6 6,-6c1.66,0 3.14,0.69 4.22,1.78L13,11h7V4l-2.35,2.35z"/></svg></button>
                        </div>
                        <div id="file_list"></div>
                    </div>
                </div>
            </div>
        </main>
        <div class="transfer-statuses">
            <section id="upload_status" class="upload-status" aria-labelledby="upload_message" hidden>

                <p id="upload_detail" class="panel-hint"></p>
                <p id="upload_error" class="transfer-error" role="status" hidden></p>
                <progress id="upload_progress" max="100" value="0" aria-labelledby="upload_message"></progress>
                <div id="upload_files" class="transfer-files"></div>
                <div class="upload-actions">
                    <button id="upload_pause" class="md-btn md-btn-tonal md-icon-button" type="button" hidden data-i18n-label="transferPause" aria-label="暫停" title="暫停"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#pause"/></svg></button>
                    <button id="upload_resume" class="md-btn md-btn-tonal md-icon-button" type="button" hidden data-i18n-label="uploadResume" aria-label="繼續" title="繼續"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#play"/></svg></button>
                    <button id="upload_cancel" class="md-btn md-btn-tonal md-icon-button" type="button" data-i18n-label="cancel" aria-label="取消" title="取消"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#close"/></svg></button>
                    <button id="upload_dismiss" class="md-btn md-btn-tonal md-icon-button" type="button" hidden data-i18n-label="close" aria-label="關閉" title="關閉"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#close"/></svg></button>
                </div>
            </section>
            <section id="download_status" class="upload-status" aria-labelledby="download_message" hidden>
                <p id="download_message" role="status" aria-live="polite"></p>
                <p id="download_detail" class="panel-hint"></p>
                <p id="download_error" class="transfer-error" role="status" hidden></p>
                <progress id="download_progress" max="100" aria-labelledby="download_message"></progress>
                <div class="upload-actions">
                    <button id="download_pause" class="md-btn md-btn-tonal md-icon-button" type="button" hidden data-i18n-label="transferPause" aria-label="暫停" title="暫停"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#pause"/></svg></button>
                    <button id="download_resume" class="md-btn md-btn-tonal md-icon-button" type="button" hidden data-i18n-label="uploadResume" aria-label="繼續" title="繼續"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#play"/></svg></button>
                    <button id="download_cancel" class="md-btn md-btn-outlined md-icon-button" type="button" hidden data-i18n-label="cancel" aria-label="取消" title="取消"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#close"/></svg></button>
                    <button id="download_dismiss" class="md-btn md-btn-tonal md-icon-button" type="button" hidden data-i18n-label="close" aria-label="關閉" title="關閉"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#close"/></svg></button>
                </div>
            </section>
        </div>
        <div id="downloadDialog" class="md-dialog-overlay">
            <div class="md-dialog" role="dialog" aria-modal="true" aria-labelledby="downloadDialogTitle">
                <div id="downloadDialogTitle" class="md-dialog-title" data-i18n="downloadFromUrl">網址下載</div>
                <div class="md-dialog-body">
                    <div class="md-field"><label for="download_url" data-i18n="downloadUrl">下載網址</label><input id="download_url" class="md-input" type="url" inputmode="url" autocomplete="off" /></div>
                    <div class="md-field"><label for="download_name" data-i18n="downloadName">檔名（可留空）</label><input id="download_name" class="md-input" type="text" autocomplete="off" /></div>
                    <p id="download_dialog_error" class="transfer-error" role="status" hidden></p>
                </div>
                <div class="md-dialog-actions">
                    <button class="md-dialog-btn" type="button" onclick="closeDialog('downloadDialog')" data-i18n="cancel">取消</button>
                    <button id="download_start" class="md-dialog-btn" type="button" data-i18n="downloadStart">下載</button>
                </div>
            </div>
        </div>

    <!-- Dialog: 彈幕模式 -->
    <div id="danmakuModeDialog" class="md-dialog-overlay">
        <div class="md-dialog" role="dialog" aria-modal="true" aria-labelledby="danmakuModeDialogTitle">
            <div class="md-dialog-title" id="danmakuModeDialogTitle" data-i18n="mode">模式</div>
            <div class="md-dialog-list">
                <button type="button" class="md-dialog-list-item active" aria-pressed="true" data-val="1" onclick="setDanmakuMode(1)"><span data-i18n="scroll">滾動</span></button>
                <button type="button" class="md-dialog-list-item" aria-pressed="false" data-val="5" onclick="setDanmakuMode(5)"><span data-i18n="top">頂部</span></button>
                <button type="button" class="md-dialog-list-item" aria-pressed="false" data-val="4" onclick="setDanmakuMode(4)"><span data-i18n="bottom">底部</span></button>
                <button type="button" class="md-dialog-list-item" aria-pressed="false" data-val="6" onclick="setDanmakuMode(6)"><span data-i18n="reverse">反向</span></button>
            </div>
            <div class="md-dialog-actions"><button type="button" onclick="closeDialog('danmakuModeDialog')" class="md-dialog-btn" data-i18n="cancel">取消</button></div>
        </div>
    </div>
    <!-- Dialog: 彈幕大小 -->
    <div id="danmakuSizeDialog" class="md-dialog-overlay">
        <div class="md-dialog" role="dialog" aria-modal="true" aria-labelledby="danmakuSizeDialogTitle">
            <div class="md-dialog-title" id="danmakuSizeDialogTitle" data-i18n="size">大小</div>
            <div class="md-dialog-list">
                <button type="button" class="md-dialog-list-item" aria-pressed="false" data-val="18" onclick="setDanmakuSize(18)"><span data-i18n="small">小</span></button>
                <button type="button" class="md-dialog-list-item active" aria-pressed="true" data-val="25" onclick="setDanmakuSize(25)"><span data-i18n="default">預設</span></button>
                <button type="button" class="md-dialog-list-item" aria-pressed="false" data-val="36" onclick="setDanmakuSize(36)"><span data-i18n="large">大</span></button>
            </div>
            <div class="md-dialog-actions"><button type="button" onclick="closeDialog('danmakuSizeDialog')" class="md-dialog-btn" data-i18n="cancel">取消</button></div>
        </div>
    </div>
    <div id="deviceInfoDialog" class="md-dialog-overlay">
        <div class="md-dialog" role="dialog" aria-modal="true" aria-labelledby="deviceInfoTitle">
            <div id="deviceInfoTitle" class="md-dialog-title" data-i18n="deviceInfo">裝置資訊</div>
            <div class="md-dialog-body"><p id="device_name" data-i18n="deviceConnecting">連線中</p></div>
            <div class="md-dialog-actions"><button type="button" class="md-dialog-btn" onclick="closeDialog('deviceInfoDialog')" data-i18n="close">關閉</button></div>
        </div>
    </div>
    <!-- Dialog: 本地路徑 -->
    <div id="fileInfoDialog" class="md-dialog-overlay">
        <div class="md-dialog" role="dialog" aria-modal="true" aria-labelledby="fileInfoDialogTitle">
            <div class="md-dialog-title" id="fileInfoDialogTitle" data-i18n="localPath">本地路徑</div>
            <div class="md-dialog-body">
                <p id="fileUrl"></p>
                <div class="md-dialog-list file-dialog-actions">
                    <button id="file_use" onclick="pushFile(1)" class="md-dialog-list-item"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#send"/></svg><span data-i18n="use">使用</span></button>
                    <button onclick="showFileChangeDialog('rename')" class="md-dialog-list-item"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#edit"/></svg><span data-i18n="rename">重新命名</span></button>
                    <button onclick="showFileChangeDialog('move')" class="md-dialog-list-item"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#move"/></svg><span data-i18n="move">搬移</span></button>
                    <button onclick="deleteSelectedFile()" class="md-dialog-list-item error"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#delete"/></svg><span data-i18n="delete">刪除</span></button>
                </div>
            </div>
            <div class="md-dialog-actions">
                <button onclick="pushFile(0)" class="md-dialog-btn" data-i18n="close">關閉</button>
            </div>
        </div>
    </div>
    <!-- Dialog: 確認上傳 -->
    <div id="uploadTip" class="md-dialog-overlay">
        <div class="md-dialog" role="dialog" aria-modal="true" aria-labelledby="uploadTipTitle">
            <div class="md-dialog-title" id="uploadTipTitle" data-i18n="uploadConfirm">確認上傳？</div>
            <div class="md-dialog-body"><ul id="uploadTipContent" class="dialog-file-list"></ul></div>
            <div class="md-dialog-actions">
                <button onclick="confirmUpload(0)" class="md-dialog-btn" data-i18n="cancel">取消</button>
                <button onclick="confirmUpload(1)" class="md-dialog-btn" data-i18n="confirm">確定</button>
            </div>
        </div>
    </div>
    <!-- Dialog: 新增資料夾 -->
    <div id="newFolder" class="md-dialog-overlay">
        <div class="md-dialog" role="dialog" aria-modal="true" aria-labelledby="newFolderTitle">
            <div class="md-dialog-title" id="newFolderTitle" data-i18n="newFolder">新增資料夾</div>
            <div class="md-dialog-body">
                <label for="newFolderContent" data-i18n="name">名稱</label><input id="newFolderContent" class="md-input" type="text" />
            </div>
            <div class="md-dialog-actions">
                <button onclick="confirmNewFolder(0)" class="md-dialog-btn" data-i18n="cancel">取消</button>
                <button onclick="confirmNewFolder(1)" class="md-dialog-btn" data-i18n="confirm">確定</button>
            </div>
        </div>
    </div>
    <!-- Dialog: 刪除資料夾 -->
    <div id="delFolder" class="md-dialog-overlay">
        <div class="md-dialog" role="dialog" aria-modal="true" aria-labelledby="delFolderTitle">
            <div class="md-dialog-title" id="delFolderTitle" data-i18n="deleteFolder">刪除資料夾</div>
            <div class="md-dialog-body" id="delFolderContent"></div>
            <div class="md-dialog-actions">
                <button onclick="confirmDelFolder(0)" class="md-dialog-btn" data-i18n="cancel">取消</button>
                <button onclick="confirmDelFolder(1)" class="md-dialog-btn error" data-i18n="delete">刪除</button>
            </div>
        </div>
    </div>
    <!-- Dialog: 刪除檔案 -->
    <div id="delFile" class="md-dialog-overlay">
        <div class="md-dialog" role="dialog" aria-modal="true" aria-labelledby="delFileTitle">
            <div class="md-dialog-title" id="delFileTitle" data-i18n="deleteFile">刪除檔案</div>
            <div class="md-dialog-body" id="delFileContent"></div>
            <div class="md-dialog-actions">
                <button onclick="confirmDelFile(0)" class="md-dialog-btn" data-i18n="cancel">取消</button>
                <button onclick="confirmDelFile(1)" class="md-dialog-btn error" data-i18n="delete">刪除</button>
            </div>
        </div>
    </div>
    <div id="fileChangeDialog" class="md-dialog-overlay">
        <div class="md-dialog" role="dialog" aria-modal="true" aria-labelledby="fileChangeTitle">
            <div class="md-dialog-title" id="fileChangeTitle"></div>
            <div class="md-dialog-body">
                <div id="fileRenameField"><label for="fileChangeValue" data-i18n="name">名稱</label><input id="fileChangeValue" class="md-input" type="text" /></div>
                <div id="fileMovePicker" class="folder-picker" hidden>
                    <p class="panel-hint" data-i18n="targetFolder">目標資料夾</p>
                    <div class="folder-location"><span id="fileMovePath" role="status"></span><button id="fileMoveUp" class="md-dialog-btn md-icon-button" type="button" onclick="loadMoveFolders(moveTarget.slice(0, moveTarget.lastIndexOf('/')))" disabled data-i18n-label="upFolder" aria-label="上層" title="上層"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#back"/></svg></button></div>
                    <div id="fileMoveFolders" class="folder-list"></div>
                    <p id="fileMoveStatus" class="panel-hint" role="status"></p>
                    <button id="fileMoveRetry" class="md-dialog-btn md-icon-button" type="button" onclick="loadMoveFolders(moveTarget)" hidden data-i18n-label="refreshFiles" aria-label="重新整理" title="重新整理"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="icons.svg#refresh"/></svg></button>
                </div>
            </div>
            <div class="md-dialog-actions"><button onclick="closeDialog('fileChangeDialog')" class="md-dialog-btn" data-i18n="cancel">取消</button><button id="fileChangeConfirm" onclick="confirmFileChange()" class="md-dialog-btn" data-i18n="confirm">確定</button></div>
        </div>
    </div>
    <div id="batchDeleteDialog" class="md-dialog-overlay">
        <div class="md-dialog" role="dialog" aria-modal="true" aria-labelledby="batchDeleteTitle">
            <div id="batchDeleteTitle" class="md-dialog-title" data-i18n="deleteSelected">刪除選取項目？</div>
            <div class="md-dialog-body"><ul id="batchDeleteList" class="dialog-file-list"></ul><p id="batchDeleteHint" class="panel-hint" data-i18n="batchDeleteHint">資料夾內容也會一併刪除。</p></div>
            <div class="md-dialog-actions"><button class="md-dialog-btn" type="button" onclick="confirmBatchDelete(false)" data-i18n="cancel">取消</button><button class="md-dialog-btn error" type="button" onclick="confirmBatchDelete(true)" data-i18n="delete">刪除</button></div>
        </div>
    </div>
    <!-- Snackbar: 警告 -->
    <div id="warnToast">
        <div class="md-snackbar" id="warnToastContent" role="status" aria-live="polite"></div>
    </div>
    <!-- Loading -->
    <div id="loadingToast">
        <div class="md-progress-wrap">
            <svg class="md-progress" viewBox="0 0 48 48">
                <circle cx="24" cy="24" r="20"/>
            </svg>
        </div>
    </div>
</body>
